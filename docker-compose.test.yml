name: psicogestion-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: psicogestion_test
      POSTGRES_USER: psicogestion_test
      POSTGRES_PASSWORD: psicogestion_test_password
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U psicogestion_test -d psicogestion_test']
      interval: 5s
      timeout: 5s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
