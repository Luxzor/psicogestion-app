openapi: 3.1.0
info:
  title: PsicoGestión API
  version: 0.1.0
  description: 'Contrato REST de PsicoGestión: administración de cuentas (Iteración 1) y registro de pacientes (Iteración 2, EDT 4.3.1).'
servers:
  - url: https://localhost:8443/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Estado de vida de la API
      security: []
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceStatus' }
  /ready:
    get:
      summary: Estado de preparación de las dependencias críticas
      security: []
      responses:
        '200':
          description: PostgreSQL y Redis disponibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyStatus' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/registro:
    post:
      summary: Crea una cuenta pendiente de verificación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/RegistrationCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /auth/verificacion:
    post:
      summary: Verifica un código de seis dígitos y activa la cuenta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationRequest' }
      responses:
        '200': { $ref: '#/components/responses/AccountActive' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '410': { $ref: '#/components/responses/ExpiredError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /auth/verificacion/reenviar:
    post:
      summary: Reenvía un código sin enumerar cuentas activas
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/VerificationResendAccepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /auth/login:
    post:
      summary: Inicia sesión y establece una cookie refresh HttpOnly
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión creada. La cookie `refresh` es HttpOnly, Secure y SameSite=Strict.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidSessionError' }
        '403': { $ref: '#/components/responses/UnverifiedError' }
        '423': { $ref: '#/components/responses/BlockedError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /auth/refresh:
    post:
      summary: Rota la cookie refresh y entrega un access token nuevo
      security: []
      responses:
        '200':
          description: Token de acceso renovado y cookie refresh rotada.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: '#/components/responses/InvalidSessionError' }
  /auth/sesion:
    delete:
      summary: Revoca la sesión actual y elimina la cookie refresh
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/InvalidSessionError' }
  /auth/recuperacion:
    post:
      summary: Solicita recuperación sin enumerar cuentas
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/RecoveryAccepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /auth/restablecimiento:
    post:
      summary: Actualiza la contraseña, consume el enlace y revoca sesiones
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/PasswordUpdated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '410': { $ref: '#/components/responses/ExpiredError' }
  /pacientes:
    post:
      summary: Registra un paciente activo (RF 3.1.1 a RF 3.1.14)
      description: >
        Requiere sesión activa. Si el CURP pertenece a un paciente dado de baja responde 409
        PACIENTE_DADO_DE_BAJA con el identificador del perfil para ofrecer su reactivación.
        Con Idempotency-Key, un reintento con los mismos datos devuelve la respuesta original sin
        crear otro registro (ADR-13).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientRequest' }
      responses:
        '201': { $ref: '#/components/responses/PatientRegistered' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidSessionError' }
        '409': { $ref: '#/components/responses/PatientConflict' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
  /pacientes/validaciones:
    post:
      summary: Verifica de forma anticipada si un CURP o teléfono ya está registrado
      description: >
        No expone datos de otros pacientes (CA-3.1-03). Un CURP de un paciente dado de baja se
        informa como disponible con dado_de_baja verdadero, porque al guardar se ofrece reactivar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityRequest' }
      responses:
        '200':
          description: Resultado de la verificación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidSessionError' }
  /pacientes/{id}/reactivacion:
    post:
      summary: Reactiva un paciente dado de baja con los datos capturados en el registro
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientRequest' }
      responses:
        '200': { $ref: '#/components/responses/PatientReactivated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidSessionError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/PatientConflict' }
  /terapeutas:
    post:
      summary: Registra un terapeuta activo (RF 2.1.1 a RF 2.1.15)
      description: >
        Requiere sesión activa. Valida formato de campos, fecha anterior al registro, cédula
        profesional de 7 u 8 dígitos y unicidad de teléfono, correo y cédula. Con Idempotency-Key,
        un reintento con los mismos datos devuelve la respuesta original sin crear otro registro.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TherapistRequest' }
      responses:
        '201': { $ref: '#/components/responses/TherapistRegistered' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidSessionError' }
        '409': { $ref: '#/components/responses/TherapistConflict' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }
  /terapeutas/validaciones:
    post:
      summary: Verifica de forma anticipada si un teléfono, correo o cédula ya está registrado
      description: >
        No expone datos de otros terapeutas (CA-2.1-03).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TherapistAvailabilityRequest' }
      responses:
        '200':
          description: Resultado de la verificación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TherapistAvailabilityResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidSessionError' }
  /terapeutas/{id}/foto:
    put:
      summary: Carga o actualiza la fotografía de perfil del terapeuta (RF 2.1.11 a RF 2.1.13)
      description: >
        Acepta imágenes JPEG o PNG de hasta 5 MB y de al menos 200 x 200 píxeles (CA-2.1-05).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto: { type: string, format: binary }
      responses:
        '200':
          description: Fotografía actualizada con éxito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TherapistPhotoResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidSessionError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '413': { $ref: '#/components/responses/PhotoTooLarge' }
        '415': { $ref: '#/components/responses/PhotoInvalidFormat' }
        '422': { $ref: '#/components/responses/PhotoInvalidDimensions' }
    get:
      summary: Descarga la fotografía de perfil del terapeuta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Archivo de fotografía en formato JPEG o PNG.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '304':
          description: La imagen no ha cambiado (If-None-Match coincide).
        '401': { $ref: '#/components/responses/InvalidSessionError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      summary: Elimina la fotografía de perfil del terapeuta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Fotografía eliminada con éxito.
        '401': { $ref: '#/components/responses/InvalidSessionError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Llave única por intento de guardado; se reutiliza al reintentar tras una falla de red.
      schema: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ServiceStatus:
      type: object
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: psicogestion-api }
    ReadyStatus:
      type: object
      required: [status, service]
      properties:
        status: { type: string, const: ready }
        service: { type: string, const: psicogestion-api }
    RegisterRequest:
      type: object
      required:
        [
          nombre_completo,
          telefono,
          correo_institucional,
          contrasena,
          confirmar_contrasena,
          consentimiento,
        ]
      properties:
        nombre_completo: { type: string, minLength: 1, maxLength: 50 }
        telefono: { type: string, pattern: '^\\d{10}$' }
        correo_institucional: { type: string, format: email }
        contrasena: { $ref: '#/components/schemas/Password' }
        confirmar_contrasena: { $ref: '#/components/schemas/Password' }
        consentimiento: { type: boolean, const: true }
    VerificationRequest:
      type: object
      required: [correo_institucional, codigo]
      properties:
        correo_institucional: { type: string, format: email }
        codigo: { type: string, pattern: '^\\d{6}$' }
    EmailRequest:
      type: object
      required: [correo_institucional]
      properties:
        correo_institucional: { type: string, format: email }
    LoginRequest:
      type: object
      required: [identificador, contrasena]
      properties:
        identificador: { type: string, minLength: 1 }
        contrasena: { type: string, minLength: 1 }
    ResetPasswordRequest:
      type: object
      required: [token, nueva_contrasena, confirmar_contrasena]
      properties:
        token: { type: string, minLength: 20, writeOnly: true }
        nueva_contrasena: { $ref: '#/components/schemas/Password' }
        confirmar_contrasena: { $ref: '#/components/schemas/Password' }
    Password:
      type: string
      minLength: 8
      maxLength: 25
      pattern: '^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$'
      writeOnly: true
    User:
      type: object
      required: [id, nombre_completo, rol]
      properties:
        id: { type: string, format: uuid }
        nombre_completo: { type: string }
        rol: { type: string, enum: [administrador] }
    LoginResponse:
      type: object
      required: [access_token, usuario]
      properties:
        access_token: { type: string }
        usuario: { $ref: '#/components/schemas/User' }
    AccessTokenResponse:
      type: object
      required: [access_token]
      properties:
        access_token: { type: string }
    ApiError:
      type: object
      required: [codigo, mensaje, correlation_id]
      properties:
        codigo: { type: string }
        mensaje: { type: string }
        campos:
          type: object
          additionalProperties: { type: string }
        correlation_id: { type: string, format: uuid }
    RegistrationResponse:
      type: object
      required: [codigo, estado]
      properties:
        codigo: { type: string, const: REGISTRO_CREADO }
        estado: { type: string, const: pendiente_verificacion }
    AccountResponse:
      type: object
      required: [codigo, estado]
      properties:
        codigo: { type: string }
        estado: { type: string, const: activo }
    MessageResponse:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string }
        mensaje: { type: string }
    PatientRequest:
      type: object
      required: [nombre_completo, curp, sexo, fecha_nacimiento, telefono]
      properties:
        nombre_completo: { type: string, minLength: 1, maxLength: 50 }
        curp:
          type: string
          description: Se normaliza a mayúsculas y sin espacios.
          pattern: '^[A-Z][AEIOUX][A-Z]{2}[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])[HMX][A-Z]{2}[B-DF-HJ-NP-TV-Z]{3}[A-Z0-9][0-9]$'
        sexo:
          type: string
          enum: [F, M, O]
          description: F femenino, M masculino, O otro.
        fecha_nacimiento:
          type: string
          format: date
          description: AAAA-MM-DD. Anterior a la fecha de registro y con al menos 7 años cumplidos.
        telefono: { type: string, pattern: '^[0-9]{10}$' }
        correo: { type: [string, 'null'], format: email, maxLength: 100 }
        consentimiento: { type: boolean, default: false }
    Patient:
      type: object
      required:
        [
          id,
          nombre_completo,
          curp,
          sexo,
          fecha_nacimiento,
          telefono,
          correo,
          consentimiento,
          activo,
          fecha_baja,
          fecha_registro,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        nombre_completo: { type: string }
        curp: { type: string }
        sexo: { type: string, enum: [F, M, O] }
        fecha_nacimiento: { type: string, format: date }
        telefono: { type: string }
        correo: { type: [string, 'null'] }
        consentimiento: { type: boolean }
        activo: { type: boolean }
        fecha_baja: { type: [string, 'null'], format: date }
        fecha_registro: { type: string, format: date }
        version: { type: integer, minimum: 1 }
    PatientResponse:
      type: object
      required: [codigo, paciente]
      properties:
        codigo: { type: string, enum: [PACIENTE_REGISTRADO, PACIENTE_REACTIVADO] }
        paciente: { $ref: '#/components/schemas/Patient' }
    PatientConflictError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            codigo:
              type: string
              enum:
                [
                  CURP_EN_USO,
                  TELEFONO_EN_USO,
                  DATOS_EN_USO,
                  PACIENTE_DADO_DE_BAJA,
                  PACIENTE_ACTIVO,
                  SOLICITUD_EN_PROCESO,
                ]
            paciente:
              type: object
              description: Solo en PACIENTE_DADO_DE_BAJA.
              properties:
                id: { type: string, format: uuid }
                nombre_completo: { type: string }
                fecha_baja: { type: string, format: date }
    AvailabilityRequest:
      type: object
      required: [campo, valor]
      properties:
        campo: { type: string, enum: [curp, telefono] }
        valor: { type: string }
        curp:
          type: string
          description: Solo para telefono; excluye al paciente dado de baja que se reactivaría con ese CURP.
    AvailabilityResponse:
      type: object
      required: [campo, disponible]
      properties:
        campo: { type: string, enum: [curp, telefono] }
        disponible: { type: boolean }
        dado_de_baja: { type: boolean }
        mensaje: { type: string }
    TherapistRequest:
      type: object
      required:
        [nombre_completo, telefono, correo_electronico, fecha_nacimiento, cedula_profesional]
      properties:
        nombre_completo: { type: string, minLength: 1, maxLength: 50 }
        telefono: { type: string, pattern: '^\d{10}$' }
        correo_electronico: { type: string, format: email, maxLength: 100 }
        fecha_nacimiento: { type: string, format: date }
        cedula_profesional: { type: string, pattern: '^\d{7,8}$' }
    Therapist:
      type: object
      required:
        [
          id,
          nombre_completo,
          telefono,
          correo_electronico,
          fecha_nacimiento,
          cedula_profesional,
          activo,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        nombre_completo: { type: string }
        telefono: { type: string }
        correo_electronico: { type: string }
        fecha_nacimiento: { type: string, format: date }
        cedula_profesional: { type: string }
        foto_perfil: { type: [string, 'null'] }
        foto_actualizada_en: { type: [string, 'null'], format: date-time }
        activo: { type: boolean }
        fecha_baja: { type: [string, 'null'], format: date }
        fecha_registro: { type: string, format: date }
        version: { type: integer, minimum: 1 }
    TherapistResponse:
      type: object
      required: [codigo, terapeuta]
      properties:
        codigo: { type: string, const: TERAPEUTA_REGISTRADO }
        terapeuta: { $ref: '#/components/schemas/Therapist' }
    TherapistPhotoResponse:
      type: object
      required: [codigo, terapeuta]
      properties:
        codigo: { type: string, const: FOTO_ACTUALIZADA }
        terapeuta: { $ref: '#/components/schemas/Therapist' }
    TherapistAvailabilityRequest:
      type: object
      required: [campo, valor]
      properties:
        campo:
          type: string
          enum: [telefono, correo, correo_electronico, cedula, cedula_profesional]
        valor: { type: string }
    TherapistAvailabilityResponse:
      type: object
      required: [campo, disponible]
      properties:
        campo: { type: string }
        disponible: { type: boolean }
        mensaje: { type: string }
    TherapistConflictError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            codigo:
              type: string
              enum:
                [TELEFONO_EN_USO, CORREO_EN_USO, CEDULA_EN_USO, DATOS_EN_USO, SOLICITUD_EN_PROCESO]
  responses:
    RegistrationCreated:
      description: Cuenta creada y código enviado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RegistrationResponse' }
    AccountActive:
      description: Cuenta activada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AccountResponse' }
    VerificationResendAccepted:
      description: Solicitud de reenvío procesada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MessageResponse' }
    RecoveryAccepted:
      description: Respuesta neutral de recuperación.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MessageResponse' }
    PasswordUpdated:
      description: Contraseña actualizada y sesiones revocadas.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MessageResponse' }
    ValidationError:
      description: Datos de entrada inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ConflictError:
      description: Correo o teléfono ya registrados.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidSessionError:
      description: Sesión o credenciales inválidas.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnverifiedError:
      description: Cuenta pendiente de verificación.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BlockedError:
      description: Cuenta bloqueada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ExpiredError:
      description: Código o enlace inválido o expirado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimitError:
      description: Se excedió el límite de intentos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: Una dependencia crítica no está disponible.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PatientRegistered:
      description: Paciente registrado y activo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PatientResponse' }
    PatientReactivated:
      description: Paciente reactivado con los datos capturados.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PatientResponse' }
    PatientConflict:
      description: CURP o teléfono en uso, paciente dado de baja o solicitud en proceso.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PatientConflictError' }
    IdempotencyMismatch:
      description: La llave de idempotencia ya se usó con otros datos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFoundError:
      description: El recurso no existe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TherapistRegistered:
